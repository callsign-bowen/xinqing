<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>森林营地</title><style>
:root{font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:#65785c;background:#bec7ad}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{display:flex;flex-direction:column}#stage{position:relative;flex:1;min-height:0;overflow:hidden;background:#bdc7ab}#stage canvas,#fallback{position:absolute;inset:0;width:100%;height:100%;display:block}#stage canvas{touch-action:none}#fallback{object-fit:cover}#status,[hidden]{display:none!important}.forest-loading{position:absolute;top:17px;left:50%;transform:translateX(-50%);max-width:90%;margin:0;padding:9px 15px;border-radius:24px;background:#f7f8efed;color:#7c8e70;font-size:11px;line-height:1.7;text-align:center;pointer-events:none;white-space:nowrap}.forest-controls{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:7px;flex-shrink:0;padding:10px 12px;min-height:60px;background:#f4f5ec;border-top:1px solid #d9e0ce}.forest-controls button{min-height:38px;border:1px solid #d6dfc9;background:transparent;border-radius:20px;color:#7c8e70;padding:7px 13px;font:11px/1.6 inherit;cursor:pointer;font-family:inherit;font-size:11px}.forest-controls button[aria-pressed=true]{background:#e2ead8;color:#5d7850;border-color:#c3d1b6}.forest-controls button:focus-visible{outline:2px solid #829b70;outline-offset:2px}@media(max-width:430px){.forest-controls{gap:5px;padding:9px 7px}.forest-controls button{padding:6px 10px;font-size:10px;min-height:36px}.forest-loading{font-size:10px}}
</style></head><body><main id="stage" aria-label="森林营地三维场景"><img id="fallback" src="../studies/forest-camp-natural-v4/draft-main.png" alt="森林营地的帐篷、火堆和圆木"><p id="status"></p><p id="forest-loading" class="forest-loading" role="status">正在准备营地…</p></main><nav class="forest-controls" aria-label="营地视角"><button data-view="main" aria-pressed="true">营地全景</button><button data-view="tent" aria-pressed="false">走近帐篷</button><button data-view="fire" aria-pressed="false">看看火堆</button><button data-view="dog" aria-pressed="false">看看小狗</button><button id="dog-greet" disabled>和小狗聊聊</button><button id="motion" aria-pressed="true">轻柔动态</button><button id="quality" aria-pressed="true">画质：精细</button><button id="background" aria-pressed="true" hidden>远景背景</button><button id="wireframe" aria-pressed="false" hidden>线框</button></nav>
<script type="module">
const stage=document.querySelector('#stage'),status=document.querySelector('#status'),loading=document.querySelector('#forest-loading');
let sentReady=false,sentError=false;
const tell=type=>{if(window.parent!==window)window.parent.postMessage({type},location.origin)};
new MutationObserver(()=>{
 if(stage.dataset.ready==='true'&&!sentReady){sentReady=true;loading.hidden=true;document.documentElement.dataset.ready='true';tell('nuo-forest:ready')}
 if(status.textContent.includes('三维暂未载入')&&!sentError){sentError=true;loading.textContent='营地暂时没能打开，可以返回后再试。';loading.hidden=false;tell('nuo-forest:error')}
 if(!sentReady&&!sentError){const progress=status.textContent.match(/\d+%/);const text=progress?`正在准备营地 · ${progress[0]}`:'正在准备营地…';if(loading.textContent!==text)loading.textContent=text}
}).observe(document.body,{subtree:true,childList:true,attributes:true,attributeFilter:['data-ready']});
document.addEventListener('keydown',event=>{if(event.key==='Escape'){event.preventDefault();tell('nuo-forest:exit')}});
</script><script type="module" src="../studies/forest-camp-natural-v4/viewer.js"></script></body></html>
